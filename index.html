<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>calcular</title>
</head>

<body class="bg-gradient-to-br from-indigo-500 to-purple-600 min-h-screen flex items-center justify-center">

    <div class="bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-80">

        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Calculatrice
        </h2>

        <input id="num1" type="number" placeholder="Escribe un numero"
            class="w-full mb-3 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <input id="num2" type="number" placeholder="Escribe otro numero"
            class="w-full mb-3 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <select id="operador"
            class="w-full mb-4 p-3 border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="+">suma</option>
            <option value="-">resta</option>
            <option value="*">multiplicación</option>
            <option value="/">división</option>
        </select>

        <button onclick="calcular()"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
            calcular
        </button>

        <div id="resultado" class="mt-5 text-center text-lg font-bold text-gray-800">
        </div>

    </div>
    <script src="./app.js"></script>
</body>

</html>
